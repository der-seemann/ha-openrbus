name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Install matching Core package
        run: python -m pip install "openrbus==0.4.1"
      - name: Run tests
        run: python -m pytest -q
      - name: Check formatting and imports
        run: ruff check custom_components tests
      - name: Compile integration
        run: python -m compileall -q custom_components
