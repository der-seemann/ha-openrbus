name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: >-
          python -m pip install
          "homeassistant>=2026.8,<2027"
          "openrbus==0.4.0"
          pytest pytest-asyncio ruff
      - name: Run tests
        run: python -m pytest -q
      - name: Check formatting and imports
        run: ruff check custom_components tests
      - name: Compile integration
        run: python -m compileall -q custom_components
